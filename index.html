<!doctype html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#06101d" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>NGR Neo</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-orb orb-a"></div>
  <div class="bg-orb orb-b"></div>
  <div class="app" id="app">
    <header class="topbar">
      <button class="logo-btn" id="logoBtn" aria-label="NGR Neo">
        <span class="neo-logo">N</span>
      </button>
      <div class="top-title">
        <h1>NGR Neo</h1>
        <p>Liquid Garage OS · Honda Beat FI 2014</p>
      </div>
      <button class="icon-btn" id="themeBtn" aria-label="Ganti tema"></button>
      <button class="icon-btn" id="settingsBtn" aria-label="Settings"></button>
    </header>

    <main id="view" class="view" aria-live="polite"></main>
  </div>

  <nav class="bottom-nav" id="bottomNav" aria-label="Navigasi utama"></nav>

  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <section class="sheet" id="sheet" hidden>
    <div class="sheet-handle"></div>
    <div id="sheetContent"></div>
  </section>

  <script src="app.js"></script>
</body>
</html>
