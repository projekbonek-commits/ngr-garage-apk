<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#080b12" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>NGR v7 Map Rusdi</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://unpkg.com" />
  <link rel="preconnect" href="https://tile.openstreetmap.org" />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.1.1/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <img src="icon-192.png" alt="NGR" />
        <div>
          <b>NGR Map Rusdi</b>
          <span id="top-sub">Manual Daily · Road Route · Assist</span>
        </div>
      </div>
      <button class="icon-btn" data-action="settings" aria-label="Settings">⚙</button>
    </header>

    <main id="main">
      <section id="tab-home" class="screen active"></section>
      <section id="tab-maps" class="screen"></section>
      <section id="tab-fuel" class="screen"></section>
      <section id="tab-money" class="screen"></section>
      <section id="tab-assist" class="screen"></section>
    </main>

    <button id="fab" class="fab" aria-label="Quick Add">＋</button>

    <nav class="nav">
      <button class="nav-item active" data-tab="home"><span>⌂</span><small>Home</small></button>
      <button class="nav-item" data-tab="maps"><span>⌖</span><small>Maps</small></button>
      <button class="nav-item" data-tab="fuel"><span>⛽</span><small>Fuel</small></button>
      <button class="nav-item" data-tab="money"><span>💸</span><small>Money</small></button>
      <button class="nav-item" data-tab="assist"><span>✚</span><small>Assist</small></button>
    </nav>
  </div>

  <div id="sheet" class="sheet-wrap" aria-hidden="true">
    <div class="sheet-backdrop"></div>
    <div class="sheet">
      <div class="grab"></div>
      <div id="sheet-content"></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="https://unpkg.com/maplibre-gl@5.1.1/dist/maplibre-gl.js"></script>
  <script src="app.js"></script>
</body>
</html>
