name: Build NGR v7 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Prepare web folder
        run: |
          rm -rf www
          mkdir -p www
          cp index.html www/
          cp style.css www/
          cp app.js www/
          cp manifest.json www/
          cp service-worker.js www/
          cp icon-192.png www/
          cp icon-512.png www/

      - name: Recreate Android platform
        run: |
          rm -rf android
          npx cap add android

      - name: Sync web app to Android
        run: npx cap sync android

      - name: Add Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          perms = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />'
          ]
          for perm in perms:
              if perm not in s:
                  s = s.replace('<application', '    ' + perm + '
    <application', 1)
          p.write_text(s)
          PY

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ngr-v7-map-rusdi-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
